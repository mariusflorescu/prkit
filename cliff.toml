# Versions and release notes for prkit, read by scripts/release-version.ts.
# Configuration reference: https://git-cliff.org/docs/configuration

[changelog]
header = ""
# The release body, which the app also shows as its changelog. Only user-facing groups, each
# line the subject without its type and scope, and the "(#N)" squash suffix as a PR link.
# No authors and no commit bodies.
body = """
{%- set pulls = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo ~ "/pull/" -%}
{%- for group, commits in commits | group_by(attribute="group") -%}
{%- if group in ["Features", "Fixes", "Performance"] %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first | replace_regex(from="\\(#([0-9]+)\\)$", to="([#$1](" ~ pulls ~ "$1))") }}
{%- endfor %}
{% endif -%}
{%- endfor -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# "Initial commit" and anything else that isn't a conventional commit is not a change.
filter_unconventional = true
filter_commits = true
# A breaking change of another type (refactor!) still bumps the version; the body hides its group.
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = ".*", skip = true },
]
# Only stable tags are releases. Nightly tags (v0.2.0-nightly.20261014.7) never match.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
# Below 1.0: feat and breaking changes bump the minor version, fix and perf the patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
