name: Release

# How releases work, and what to check by hand: docs/operations/release.md.
on:
  # Temporary: dry-runs this workflow on its own pull request. Removed before merge.
  pull_request:
  schedule:
    # The nightly. Off the hour, when GitHub's scheduler is least busy.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "nightly builds main; stable promotes the latest nightly"
        type: choice
        options: [nightly, stable]
        default: nightly
      dry_run:
        description: "Build unsigned without the release environment, and publish nothing"
        type: boolean
        default: false

# One run per channel at a time, and a running release is never cancelled.
concurrency:
  group: release-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      commit: ${{ steps.resolve.outputs.commit }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag: the previous releases decide the version and where the notes start.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve the commit, version and notes
        id: resolve
        env:
          CHANNEL: ${{ inputs.channel || 'nightly' }}
          # A run that isn't a schedule or a dispatch can only ever be a dry run.
          DRY_RUN: ${{ (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || inputs.dry_run == true }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: RUN_DATE="$(date -u +%Y%m%d)" .github/scripts/resolve-release.sh

      - name: Upload the release notes
        if: steps.resolve.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (macOS arm64)
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    # Only a real release asks for the environment. It admits main alone, so a dry run from any
    # other ref would fail at the gate, and a dry run never needs its secrets.
    environment: ${{ needs.resolve.outputs.dry_run != 'true' && 'release' || '' }}
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
          CSC_LINK: ${{ needs.resolve.outputs.dry_run != 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.resolve.outputs.dry_run != 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ needs.resolve.outputs.dry_run != 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.resolve.outputs.dry_run != 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.resolve.outputs.dry_run != 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PRKIT_DESKTOP_APP_ID: ${{ vars.PRKIT_DESKTOP_APP_ID }}
          PRKIT_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          signing=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID PRKIT_DESKTOP_APP_ID)
          missing=()
          for name in "${signing[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done

          args=(--arch arm64 --build-version "$VERSION" --skip-build)
          if [[ "$DRY_RUN" != "true" && ${#missing[@]} -eq 0 ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            trap 'rm -f "$key_path"' EXIT
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
            signed=true
          else
            # Half a signing setup must not sign: an unsigned build carries no identity at all.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            signed=false
          fi

          {
            echo "## Build ${VERSION}"
            echo ""
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry run: built unsigned without the release environment. Not published."
            elif [[ "$signed" == "true" ]]; then
              echo "Signing and notarizing: every secret and variable is set."
            else
              echo "Unsigned: not published. Missing: ${missing[*]}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '.scripts["dist:desktop:artifact"]' package.json > /dev/null; then
            echo "::error::package.json has no dist:desktop:artifact script, so this commit can't be packaged."
            exit 1
          fi

          pnpm dist:desktop:artifact "${args[@]}" | tee "$RUNNER_TEMP/package.log"
          result="$(tail -n 1 "$RUNNER_TEMP/package.log")"
          jq -e --arg version "$VERSION" --argjson signed "$signed" \
            '.version == $version and .arch == "arm64" and .signed == $signed and (.files | length > 0)' \
            <<< "$result" > /dev/null || {
            echo "::error::The packaging script reported something other than this build: $result"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/assets"
          jq -r '.files[]' <<< "$result" | while IFS= read -r file; do
            cp "$file" "$RUNNER_TEMP/assets/"
          done
          ls -l "$RUNNER_TEMP/assets"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      # Nothing signed is uploaded unless macOS itself accepts it.
      - name: Verify the signature and notarization
        if: steps.package.outputs.signed == 'true'
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 2 -name '*.app' -type d -print -quit)"
          [[ -n "$app" ]] || { echo "::error::No .app under release/."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -t exec -vv "$app"
          xcrun stapler validate "$app"
          shopt -s nullglob
          dmgs=("$RUNNER_TEMP"/assets/*.dmg)
          [[ ${#dmgs[@]} -gt 0 ]] || { echo "::error::No .dmg was built."; exit 1; }
          for dmg in "${dmgs[@]}"; do
            xcrun stapler validate "$dmg"
          done

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prkit-mac-arm64-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish
    needs: [resolve, build]
    if: needs.build.outputs.signed == 'true' && needs.resolve.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.resolve.outputs.channel }}
      TAG: ${{ needs.resolve.outputs.tag }}
      NAME: ${{ needs.resolve.outputs.name }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      MAKE_LATEST: ${{ needs.resolve.outputs.make_latest }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prkit-mac-arm64-${{ needs.resolve.outputs.version }}
          path: assets

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Publish the release
        run: |
          set -euo pipefail
          feed="latest-mac.yml"
          [[ "$CHANNEL" == "nightly" ]] && feed="nightly-mac.yml"
          files=()
          for pattern in "*.dmg" "*.zip" "*.blockmap" "$feed"; do
            mapfile -t matched < <(compgen -G "assets/$pattern" || true)
            if [[ ${#matched[@]} -eq 0 ]]; then
              echo "::error::The build has no $pattern."
              exit 1
            fi
            files+=("${matched[@]}")
          done
          gh release create "$TAG" "${files[@]}" \
            --target "$COMMIT" \
            --title "$NAME" \
            --notes-file notes/release-notes.md \
            --prerelease="$PRERELEASE" \
            --latest="$MAKE_LATEST"
          echo "Published [$NAME]($GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the 14 newest nightlies
        if: needs.resolve.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          newest_first() {
            sed -nE 's/^(v[0-9]+\.[0-9]+\.[0-9]+-nightly\.([0-9]{8})\.([0-9]+))$/\2 \3 \1/p' \
              | sort -k1,1nr -k2,2nr | cut -d ' ' -f 3
          }
          tags="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' | newest_first)"
          releases="$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | newest_first)"
          for tag in $(tail -n +15 <<< "$releases"); do
            echo "Deleting the release and tag $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
          # A nightly tag left without its release.
          for tag in $(tail -n +15 <<< "$tags"); do
            if ! grep -qxF "$tag" <<< "$releases"; then
              echo "Deleting the tag $tag"
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            fi
          done
