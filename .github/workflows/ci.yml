name: CI

on:
  pull_request:
    # edited: a renamed PR gets its title checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm fmt:check

      - name: Unit tests
        run: pnpm exec vp test --run

      - name: Build
        run: pnpm build

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Require a conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-title.sh "$TITLE"

  # The macOS package build is the slow part, so a PR pays for it only when it touches what
  # goes into the app bundle.
  changes:
    name: Desktop changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect desktop packaging changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Pushes to main always package the app."
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(apps/desktop/|scripts/build-desktop-artifact|apps/server/vite\.config\.ts$)'
          if git diff --name-only "$BASE_SHA" HEAD | grep -E "$pattern"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that goes into the app bundle changed."
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (macOS arm64, unsigned)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        env:
          # A runner keychain identity must never sign a CI build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          PRKIT_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pnpm dist:desktop:artifact --arch arm64 --build-version "0.0.0-ci.${GITHUB_RUN_NUMBER}" --skip-build \
            | tee "$RUNNER_TEMP/package.log"
          mkdir -p "$RUNNER_TEMP/package"
          tail -n 1 "$RUNNER_TEMP/package.log" | jq -r '.files[]' | while IFS= read -r file; do
            cp "$file" "$RUNNER_TEMP/package/"
          done
          ls -l "$RUNNER_TEMP/package"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prkit-mac-arm64-ci-${{ github.run_number }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 3

  # The one check branch protection needs. It fails when any job above fails or is cancelled.
  # pr-title is skipped on pushes to main, and package when nothing desktop changed.
  ci:
    name: CI
    if: always()
    needs: [check, pr-title, changes, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e --arg event "$GITHUB_EVENT_NAME" --arg desktop "$DESKTOP" '
            all(to_entries[];
              .value.result == "success"
              or (.key == "pr-title" and .value.result == "skipped" and $event != "pull_request")
              or (.key == "package" and .value.result == "skipped" and $desktop == "false"))' > /dev/null
